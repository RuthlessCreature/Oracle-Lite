name: CI

on:
  push:
    branches: ["main", "feat/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Test
        run: pytest -q
      - name: Compile
        run: python -m compileall -q oracle_lite talker
      - name: Dashboard JavaScript syntax
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          from oracle_lite.dashboard import DASHBOARD_HTML
          match = re.search(r"<script>(.*?)</script>", DASHBOARD_HTML, re.S)
          assert match, "dashboard script missing"
          Path("/tmp/oracle-dashboard.js").write_text(match.group(1), encoding="utf-8")
          PY
          node --check /tmp/oracle-dashboard.js
      - name: Talker JavaScript syntax
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          html = Path("talker/static/index.html").read_text(encoding="utf-8")
          match = re.search(r"<script>(.*?)</script>", html, re.S)
          assert match, "talker script missing"
          Path("/tmp/oracle-talker.js").write_text(match.group(1), encoding="utf-8")
          PY
          node --check /tmp/oracle-talker.js
