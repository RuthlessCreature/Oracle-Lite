# Oracle-Lite reference CPT config for RTX 4080 16GB.
# Replace base_model and dataset_dir with your local paths.
base_model: path/to/local/7b-or-8b-base-model

# Produced by: oracle-lite build-cpt <snapshot_id>
dataset_dir: .oracle/datasets/REPLACE_SNAPSHOT_ID/cpt
output_dir: outputs/cpt-7b-4080

# 4080-friendly QLoRA defaults
load_in_4bit: true
bnb_4bit_quant_type: nf4
bnb_4bit_use_double_quant: true
compute_dtype: bfloat16
allow_tf32: true

lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
target_modules: all-linear

max_seq_length: 2048
micro_batch_size: 1
gradient_accumulation_steps: 16
gradient_checkpointing: true

learning_rate: 0.0001
num_train_epochs: 1.0
max_steps: -1
warmup_ratio: 0.03
weight_decay: 0.0
optim: paged_adamw_8bit

logging_steps: 10
save_steps: 100
save_total_limit: 3
dataloader_num_workers: 0
seed: 42

# Finds the latest checkpoint in output_dir and resumes if present.
resume_from_checkpoint: auto
trust_remote_code: false
