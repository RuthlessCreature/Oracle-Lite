[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oracle-lite"
version = "0.5.3"
description = "Local-first multimodal dataset factory and incremental domain-model training pipeline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "typer>=0.12",
  "rich>=13.7",
  "PyYAML>=6.0",
  "requests>=2.32",
  "pypdf>=5.0",
  "PyMuPDF>=1.25",
  "Pillow>=11.0",
  "python-docx>=1.1",
  "python-pptx>=1.0",
  "huggingface-hub>=0.30",
  "psutil>=6.1",
  "nvidia-ml-py>=12.570",
]

[project.optional-dependencies]
train = [
  "torch>=2.6",
  "torchvision>=0.21",
  "transformers>=5.11",
  "datasets>=3.0",
  "accelerate>=1.0",
  "peft>=0.15",
  "bitsandbytes>=0.45",
]
dev = [
  "pytest>=8.0",
  "pytest-timeout>=2.3",
  "ruff>=0.7",
]

[project.scripts]
oracle-lite = "oracle_lite.cli:app"

[tool.setuptools.packages.find]
include = ["oracle_lite*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 45
timeout_method = "thread"
